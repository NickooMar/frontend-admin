server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Hashed, content-addressed build assets: safe to cache forever.
    # Never fall back to index.html here — a missing asset must return 404,
    # not HTML, otherwise the browser rejects it as a disallowed MIME type.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The HTML entrypoint must never be cached, so a redeploy that changes the
    # asset hashes is picked up immediately instead of requesting stale assets.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA: every route is served by index.html and resolved client-side.
    location / {
        try_files $uri /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
